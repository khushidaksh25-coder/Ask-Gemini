<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Gemini AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Ask Gemini AI</h1>
        <p>Your AI-powered assistant</p>
    </header>

    <main>
        <form id="form">
            <label for="textarea">Enter your question</label>
            <textarea id="textarea" placeholder="Ask me anything..." rows="5" required></textarea>

            <button id="submitBtn" type="submit">Ask Gemini</button>
        </form>

        <section id="answer">
            <h2>AI Answer</h2>
            <p id="answerText">Your answer will appear here.</p>
        </section>
    </main>

    
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>
<script src="script.js"></script>

</body>

</html>
