
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fun Facts</title>
    <link rel="stylesheet" href="fun.css">
    <script src="fun.js" defer></script>
</head>
<body>
    <main class="container">
        <div class="badge">✨ Powered by Gemini AI</div>

        <h1>AI Fun Facts</h1>
        <p class="subtitle">
            Discover something amazing with every click!
        </p>

        <section class="fact-card">
            <div class="bulb">💡</div>
            <h2>Did You Know?</h2>

            <p id="fact">
                Ready to discover something interesting?
            </p>

            <p id="status" class="status" aria-live="polite"></p>

            <button id="generate-btn" type="button">
                Generate New Fact ✨
            </button>
        </section>

        <p class="footer">Made with ❤️ using JavaScript & Gemini AI</p>
    </main>
</body>
</html>
